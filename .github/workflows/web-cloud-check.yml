name: Web cloud verification

on:
  push:
    branches: [web-dev]
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Check container syntax and Compose values
        run: |
          bash -n deploy/update.sh
          docker compose --env-file deploy/.env.example -f deploy/compose.yaml config --quiet
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run audit
      - run: npm run build:web

  postgres-schema:
    name: 独立 PostgreSQL 业务迁移自检
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ocstudio_ci
          POSTGRES_PASSWORD: ci_only_pg_password
          POSTGRES_DB: ocstudio_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ocstudio_ci -d ocstudio_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ocstudio_ci:ci_only_pg_password@127.0.0.1:5432/ocstudio_ci
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci_testing_only_randomized_secret_for_cloud_maps_2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Better Auth 表结构迁移
        run: npx auth migrate --yes --config ./src/lib/cloud/server/auth.ts
      - name: 云端业务迁移
        run: node scripts/cloud-migrate-business.cjs
      - name: 重复运行迁移（幂等验证）
        run: node scripts/cloud-migrate-business.cjs
      - name: 真实 PostgreSQL 结构与地图约束自检
        run: node scripts/cloud-db-smoke.cjs
      - name: 跨资料库地图名称与软删除唯一性集成测试
        run: node scripts/cloud-postgres-map-smoke.cjs
      - name: 创建专用 HTTP 测试账号
        run: node scripts/cloud-ci-seed-user.cjs
      - name: 构建真实 PostgreSQL Web 服务
        run: npm run build:web
      - name: 使用真实 PostgreSQL 完成登录与工作台 HTTP 联调
        run: |
          mkdir -p /tmp/ocstudio-ci-media
          node .next/standalone/server.js > /tmp/ocstudio-web-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node scripts/cloud-http-smoke.cjs || {
            cat /tmp/ocstudio-web-server.log
            exit 1
          }
        env:
          MEDIA_ROOT: /tmp/ocstudio-ci-media

  publish-docker:
    name: 构建并发布 Docker 至 GHCR
    needs: [web, postgres-schema]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      packages: write
    concurrency:
      group: ocstudio-docker-web-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare GHCR image names
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "WEB_IMAGE=ghcr.io/${owner}/oc-studio-web" >> "$GITHUB_ENV"
          echo "MIGRATION_IMAGE=ghcr.io/${owner}/oc-studio-web-migrate" >> "$GITHUB_ENV"
          echo "REVISION_TAG=sha-${GITHUB_SHA:0:12}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Publish the migrator first; publishing the Web :dev tag marks
      # the release as available to VPS polling/deployment.
      - name: Build and publish migration image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: migrate
          platforms: linux/amd64
          push: true
          tags: ${{ env.MIGRATION_IMAGE }}:${{ env.REVISION_TAG }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=ocstudio-migrate
          cache-to: type=gha,mode=max,scope=ocstudio-migrate

      - name: Build and publish Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: web
          platforms: linux/amd64
          push: true
          tags: ${{ env.WEB_IMAGE }}:${{ env.REVISION_TAG }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=ocstudio-web
          cache-to: type=gha,mode=max,scope=ocstudio-web

      # Every verified commit publishes an immutable SHA image. Only a verified
      # current branch head may promote both SHA images to the floating dev tags.
      # This also works when the repository is private.
      - name: Promote current verified commit to dev
        shell: bash
        env:
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          newest="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_API_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/branches/web-dev" \
            | node -pe "JSON.parse(require('fs').readFileSync(0,'utf8')).commit.sha")"
          if [[ "$newest" != "$GITHUB_SHA" ]]; then
            echo "A newer commit is on web-dev. Both immutable SHA images were published."
            echo "Skipping dev tag promotion until the latest commit passes CI."
            exit 0
          fi
          docker buildx imagetools create -t "${MIGRATION_IMAGE}:dev" "${MIGRATION_IMAGE}:${REVISION_TAG}"
          docker buildx imagetools create -t "${WEB_IMAGE}:dev" "${WEB_IMAGE}:${REVISION_TAG}"
          echo "Published verified dev images from ${GITHUB_SHA}."
