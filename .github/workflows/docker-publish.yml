name: Publish OC Studio Docker images

on:
  workflow_run:
    workflows: ["Web cloud verification"]
    types: [completed]
    branches: [web-dev]

permissions:
  contents: read
  packages: write

concurrency:
  group: ocstudio-docker-web-dev
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'web-dev' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Skip superseded revisions
        id: current
        shell: bash
        run: |
          current_sha="$(git ls-remote https://github.com/${{ github.repository }}.git refs/heads/web-dev | cut -f1)"
          if [[ "$current_sha" == "${{ github.event.workflow_run.head_sha }}" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Skipping an older successful CI revision."
          fi

      - name: Prepare image names
        if: steps.current.outputs.publish == 'true'
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "WEB_IMAGE=ghcr.io/${owner}/oc-studio-web" >> "$GITHUB_ENV"
          echo "MIGRATION_IMAGE=ghcr.io/${owner}/oc-studio-web-migrate" >> "$GITHUB_ENV"
          echo "REVISION_TAG=sha-${GITHUB_SHA:0:12}" >> "$GITHUB_ENV"
        env:
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v3
        if: steps.current.outputs.publish == 'true'

      - uses: docker/login-action@v3
        if: steps.current.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Publish migrator first: the 'dev' web tag is the last release marker.
      - name: Build and publish migration image
        if: steps.current.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: migrate
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.MIGRATION_IMAGE }}:dev
            ${{ env.MIGRATION_IMAGE }}:${{ env.REVISION_TAG }}
          labels: |
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=ocstudio-migrate
          cache-to: type=gha,mode=max,scope=ocstudio-migrate

      - name: Build and publish standalone Web image
        if: steps.current.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: web
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.WEB_IMAGE }}:dev
            ${{ env.WEB_IMAGE }}:${{ env.REVISION_TAG }}
          labels: |
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=ocstudio-web
          cache-to: type=gha,mode=max,scope=ocstudio-web
