name: ocstudio-cloud

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ocstudio
      POSTGRES_USER: ocstudio
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set_DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ocstudio -d ocstudio"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [internal]

  migrate:
    build:
      context: ..
      target: migrate
    profiles: [tools]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set_DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set_BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?set_BETTER_AUTH_URL}
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]
    command: ["/bin/sh", "-ec", "./node_modules/.bin/auth migrate --config ./src/lib/cloud/server/auth.ts --yes && node scripts/cloud-migrate-business.cjs"]

  web:
    build:
      context: ..
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?set_DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set_BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?set_BETTER_AUTH_URL}
      MEDIA_ROOT: /data/media
      NODE_ENV: production
    volumes:
      - media_data:/data/media
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  proxy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]
    networks: [internal]

networks:
  internal:

volumes:
  db_data:
  media_data:
  caddy_data:
  caddy_config:
